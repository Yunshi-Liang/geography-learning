<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>经纬 · 地理学习</title>
  <meta name="description" content="地理科学导论学习工具：141 个知识点 + 艾宾浩斯间隔复习 + 学科逻辑学习路径" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="经纬" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.png" sizes="64x64" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="h-title"><span class="h-logo"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" rx="112" fill="#0071e3"/><g fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"><circle cx="256" cy="256" r="150"/><ellipse cx="256" cy="256" rx="64" ry="150"/><line x1="106" y1="256" x2="406" y2="256"/></g></svg></span>经纬</div>
      <div class="h-date" id="hDate"></div>
    </header>

    <main id="views">
      <section id="page-today" class="view"></section>
      <section id="page-explore" class="view"></section>
      <section id="page-progress" class="view"></section>
    </main>

    <nav id="tabbar">
      <button class="tab" data-tab="today">
        <span class="tab-ico">☀</span><span class="tab-label">今日</span>
      </button>
      <button class="tab" data-tab="explore">
        <span class="tab-ico">◍</span><span class="tab-label">探索</span>
      </button>
      <button class="tab" data-tab="progress">
        <span class="tab-ico">▤</span><span class="tab-label">进度</span>
      </button>
    </nav>
  </div>

  <div id="sheetMask"></div>
  <div id="sheet"><div id="sheetContent"></div></div>
  <div id="phaseModal"><div id="phaseModalContent"></div></div>
  <div id="quizOverlay"></div>
  <div id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
